services:
  mysql:
    image: mysql:8.0
    container_name: uptik-laravel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: uptik
      MYSQL_USER: uptik
      MYSQL_PASSWORD: uptik
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uuptik", "-puptik"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - mysqldata:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: uptik-laravel-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: uptik
      PMA_PASSWORD: uptik
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysqldata:
