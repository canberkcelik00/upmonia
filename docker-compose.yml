name: upmonia

services:
  mysql:
    image: mysql:8.0
    container_name: upmonia-laravel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: upmonia
      MYSQL_USER: upmonia
      MYSQL_PASSWORD: upmonia
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uupmonia", "-pupmonia"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - mysqldata:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: upmonia-laravel-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: upmonia
      PMA_PASSWORD: upmonia
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysqldata:
