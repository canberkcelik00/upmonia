services:
  mysql:
    image: mysql:8.0
    container_name: uptik-laravel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: uptik
      MYSQL_USER: uptik
      MYSQL_PASSWORD: uptik
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uuptik", "-puptik"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - mysqldata:/var/lib/mysql

volumes:
  mysqldata:
